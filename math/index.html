<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>数学Ⅰ ラボ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+1+Code:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
/* Layout: 白地で読みやすさ優先。重要語は赤の下線、選択肢はマークシート風。上部タブで6つのステーションを行き来する単一ページ */
:root{
  color-scheme:light;
  --paper:#FFFFFF;
  --card:#FFFFFF;
  --card-2:#F6F7FA;
  --ink:#161B2B;
  --muted:#454D61;
  --line:#D5DAE4;
  --accent:#D02B62;      /* マークシートの赤：重要語の下線 */
  --accent-soft:#FCE8EF;
  --cobalt:#2550B8;      /* コード・データ */
  --cobalt-soft:#E8EEFB;
  --marker:#FFD84D;      /* 実行中の行だけに使う */
  --on-marker:#161B2B;
  --good:#0B8466;
  --good-soft:#E2F5EE;
  --bad:#C9461F;
  --bad-soft:#FCEBE5;
  --shadow:0 1px 2px rgba(22,27,43,.06);
  --f-display:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --f-code:"M PLUS 1 Code","BIZ UDGothic","Osaka-Mono","Consolas",monospace;
  --r:10px;
}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.9;letter-spacing:.02em;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
h1,h2,h3{text-wrap:balance;margin:0}
h2{font-family:var(--f-display);font-weight:700;font-size:clamp(1.5rem,4vw,2.1rem);line-height:1.3;letter-spacing:.01em}
h3{font-size:1.12rem;font-weight:700;line-height:1.45}
p{margin:0}
a{color:var(--cobalt)}
button{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px;border-radius:4px}
mark{background:none;color:inherit;font-weight:700;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:5px;text-decoration-skip-ink:none}
code,.mono{font-family:var(--f-code)}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1040px;margin:0 auto;padding-inline:16px;display:flex;align-items:center;gap:14px;min-height:56px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.15rem;white-space:nowrap;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.brand .dot{width:22px;height:13px;border:2px solid var(--accent);border-radius:50%;display:inline-block;background:var(--accent)}
.xp{margin-left:auto;font-size:.8rem;display:flex;align-items:center;gap:8px;white-space:nowrap}
.xp b{font-family:var(--f-code);font-weight:600}
.xp .rank{background:var(--marker);color:var(--on-marker);padding:2px 8px;border-radius:999px;font-weight:700}
.tabs{max-width:1040px;margin:0 auto;padding-inline:16px;display:flex;flex-wrap:wrap;gap:0 2px}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;padding:8px 12px 10px;font-weight:700;font-size:.92rem;color:var(--muted);
  cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .tag{font-family:var(--f-code);font-size:.7rem;color:var(--muted);font-weight:400}

/* ---------- generic blocks ---------- */
.view{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;padding-top:28px}
.sec-head{display:grid;gap:8px}
.eyebrow{font-size:.78rem;letter-spacing:.12em;font-weight:700;color:var(--accent)}
.lead{color:var(--muted);max-width:44em;font-size:1.02rem}
h1,h2,h3,h4,.lead,.station p,.point p{word-break:auto-phrase}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.lab{padding:20px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;min-width:0}
.lab-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.lab-head .kind{font-size:.72rem;font-weight:700;letter-spacing:.08em;padding:2px 8px;border-radius:999px;background:var(--cobalt-soft);color:var(--cobalt)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.points{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:12px}
.points:has(> :nth-child(3):last-child){grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))}
.point{background:var(--card-2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:6px;min-width:0}
.point h4{margin:0;font-size:.98rem}
.point p,.point li{font-size:.97rem}
.point ul{margin:0;padding-left:1.2em}
.trap{border-left:4px solid var(--bad);background:var(--bad-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:.92rem}
.trap b{color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{appearance:none;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);padding:7px 14px;border-radius:8px;font-weight:700;cursor:pointer;font-size:.9rem}
.btn:hover{filter:brightness(1.15)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.sm{padding:4px 10px;font-size:.82rem}
.btn[disabled]{opacity:.4;cursor:default}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{appearance:none;border:0;background:transparent;padding:6px 12px;font-weight:700;cursor:pointer;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
label.ctl{display:grid;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=text],input[type=number],select,textarea{font-family:var(--f-code);font-size:.95rem;padding:6px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);min-width:0;max-width:100%}
.readout{font-family:var(--f-code);font-size:1.05rem;font-weight:600}
.big-num{font-family:var(--f-display);font-weight:700;font-size:clamp(1.8rem,6vw,2.6rem);line-height:1.1}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--card-2);border:1px solid var(--line);white-space:nowrap}
.chip.hot{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.ok{background:var(--good-soft);color:var(--good);border-color:transparent}
.scroll-x{overflow-x:auto;min-width:0}
table.tbl{border-collapse:collapse;width:100%;font-size:.9rem}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{font-size:.78rem;letter-spacing:.06em;color:var(--muted);font-weight:700;white-space:nowrap}
svg text{fill:var(--ink);font-family:var(--f-body)}
.flash{animation:flash .5s ease}
@keyframes flash{0%{background:var(--marker)}100%{background:transparent}}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:stretch}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.hero-title{font-family:var(--f-display);font-weight:900;font-size:clamp(2.1rem,7vw,3.6rem);line-height:1.12;letter-spacing:.01em}
.hero-title .hl{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:.12em;text-underline-offset:.14em;text-decoration-skip-ink:none}
.count{padding:20px;display:grid;gap:8px;align-content:center;background:var(--ink);color:var(--paper);border:0}
.count .lbl{font-size:.8rem;letter-spacing:.1em;opacity:.8}
.count .days{font-family:var(--f-display);font-weight:700;font-size:clamp(3.2rem,12vw,5rem);line-height:1}
.count .days small{font-size:.35em;margin-left:6px}
.count .sub{font-size:.85rem;opacity:.85}
.blueprint{display:flex;height:54px;border-radius:8px;overflow:hidden;border:1.5px solid var(--ink)}
.blueprint div{display:flex;flex-direction:column;justify-content:center;padding:0 10px;font-size:.78rem;line-height:1.3;border-right:1.5px solid var(--ink);min-width:0;overflow:hidden}
.blueprint div:last-child{border-right:0}
.blueprint b{font-size:.92rem;white-space:nowrap}
.stations{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.station{appearance:none;text-align:left;cursor:pointer;padding:16px;display:grid;gap:8px;align-content:start;transition:transform .15s}
.station.wide{grid-column:1/-1}
@media (min-width:1000px){.station.wide{grid-column:span 2}}
.gl{margin:0;display:grid}
.gl-row{display:grid;grid-template-columns:minmax(0,14em) minmax(0,1fr);gap:4px 24px;padding:12px 0;border-bottom:1px solid var(--line)}
@media (max-width:640px){.gl-row{grid-template-columns:minmax(0,1fr)}}
.gl dt{display:grid;gap:0;align-content:start}
.gl-term{font-weight:700;font-size:1.08rem;line-height:1.5}
.gl-yomi{font-size:.8rem;color:var(--muted)}
.gl dd{margin:0;display:grid;gap:6px;justify-items:start}
.gl-go{cursor:pointer;font-family:inherit;color:var(--cobalt)}
mark.hit{background:var(--marker);color:var(--on-marker);text-decoration:none;font-weight:inherit;padding:0 1px}
.station:hover{transform:translateY(-2px);border-color:var(--ink)}
.station .ic{font-family:var(--f-code);font-weight:600;font-size:.82rem;color:var(--cobalt)}
.station h3{font-family:var(--f-display);font-weight:700;font-size:1.25rem}
.bar{height:6px;border-radius:999px;background:var(--card-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--good);width:0}
.priority{font-size:.72rem;font-weight:700;color:var(--accent)}

/* ---------- quiz (マークシート) ---------- */
.q{padding:20px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;min-width:0}
.q-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.q-stem{font-size:1rem;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.tracer>div{grid-template-columns:minmax(0,1fr)}
.q-choices{display:grid;gap:8px}
.choice{appearance:none;display:flex;gap:12px;align-items:flex-start;text-align:left;padding:10px 12px;border:1.5px solid var(--line);
  border-radius:10px;background:var(--card);cursor:pointer;line-height:1.55;min-width:0}
.choice:hover{border-color:var(--ink)}
.oval{flex:none;width:34px;height:20px;border:1.8px solid var(--accent);border-radius:50%;display:grid;place-items:center;
  font-family:var(--f-code);font-size:.75rem;font-weight:600;color:var(--accent);margin-top:2px}
.choice.picked .oval{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.choice.right{border-color:var(--good);background:var(--good-soft)}
.choice.right .oval{background:var(--good);border-color:var(--good);color:#fff}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice[disabled]{cursor:default}
.choice-body{min-width:0}
.exp{border-top:1.5px dashed var(--line);padding-top:12px;display:grid;gap:8px;font-size:1rem}
.verdict{font-family:var(--f-display);font-weight:700;font-size:1.2rem}
.verdict.ok{color:var(--good)}.verdict.ng{color:var(--bad)}

/* ---------- code (共通テスト用プログラム表記) ---------- */
.code{font-family:var(--f-code);font-size:.88rem;line-height:1.75;background:var(--card-2);border:1px solid var(--line);border-radius:8px;padding:10px 0;overflow-x:auto;min-width:0}
.code .ln{display:flex;white-space:pre;padding:0 12px 0 0;border-left:4px solid transparent}
.code .ln .no{color:var(--muted);width:3.4em;flex:none;text-align:right;padding-right:10px;user-select:none}
.code .ln .gd{color:var(--muted)}
.code .ln.cur{background:var(--marker);color:var(--on-marker);border-left-color:var(--accent)}
.code .ln.cur .no,.code .ln.cur .gd{color:var(--on-marker)}
.code .kw{color:var(--accent);font-weight:600}
.code .ln.cur .kw{color:var(--on-marker)}
.code .str{color:var(--good)}
.code .ln.cur .str{color:var(--on-marker)}
.code .cmt{color:var(--muted)}

/* ---------- tracer ---------- */
.tracer{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.tracer{grid-template-columns:minmax(0,1fr)}}
.note{background:var(--cobalt-soft);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:.92rem;min-height:3.2em}
.vars{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.var{border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--card)}
.var .k{font-family:var(--f-code);font-size:.78rem;color:var(--muted)}
.var .v{font-family:var(--f-code);font-weight:600;font-size:1.1rem}
.var.chg{border-color:var(--accent);background:var(--accent-soft)}
.var.hide .v{filter:blur(6px)}
.arr{display:grid;gap:4px;min-width:0}
.arr .nm{font-family:var(--f-code);font-size:.8rem;color:var(--muted)}
.cells{display:flex;gap:4px;flex-wrap:wrap}
.cell{min-width:44px;display:grid;gap:2px;justify-items:center}
.cell .bx{width:100%;min-height:40px;display:grid;place-items:center;border:1.5px solid var(--ink);border-radius:6px;font-family:var(--f-code);font-weight:600;background:var(--card);padding:0 6px;position:relative}
.cell .bx .barfill{position:absolute;left:0;right:0;bottom:0;background:var(--cobalt-soft);border-radius:0 0 4px 4px;z-index:0}
.cell .bx span{position:relative;z-index:1}
.cell.chg .bx{background:var(--accent-soft);border-color:var(--accent)}
.cell .ix{font-family:var(--f-code);font-size:.7rem;color:var(--muted)}
.cell .ptr{font-family:var(--f-code);font-size:.7rem;font-weight:600;color:var(--accent);min-height:1.2em;text-align:center;line-height:1.2}
.console{font-family:var(--f-code);font-size:.86rem;background:var(--ink);color:var(--paper);border-radius:8px;padding:10px 12px;min-height:3em;white-space:pre-wrap;overflow-wrap:anywhere}

/* ---------- bits ---------- */
.bits{display:flex;gap:6px;flex-wrap:wrap}
.bitcol{display:grid;gap:4px;justify-items:center}
.bit{appearance:none;width:44px;height:52px;border-radius:8px;border:2px solid var(--ink);background:var(--card);font-family:var(--f-code);font-size:1.4rem;font-weight:600;cursor:pointer;transition:background .12s}
.bit.on{background:var(--ink);color:var(--paper)}
.bitcol .w{font-family:var(--f-code);font-size:.72rem;color:var(--muted)}
@media (max-width:440px){.bit{width:34px;height:44px;font-size:1.15rem}}
.pix{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;width:100%;max-width:210px;aspect-ratio:1}
.pix button{appearance:none;border:1px solid var(--line);background:var(--card-2);padding:0;cursor:pointer;border-radius:2px;min-width:0}
.pix button.on{background:var(--ink);border-color:var(--ink)}
.pix.res button{cursor:default}
.pix.res button.on{background:var(--accent);border-color:var(--accent)}
.pixrow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);gap:14px;align-items:center;max-width:820px}
.pixrow>div:not(.op){display:grid;gap:6px;justify-items:center;min-width:0}
.pix-lbl{font-size:.92rem;font-weight:700;white-space:nowrap}
.seg{justify-self:start}
@media (max-width:560px){.pix-lbl{font-size:.8rem}}
.res-wrap .pix-lbl{color:var(--accent)}
@media (max-width:560px){.pixrow{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
  .pixrow .eq{grid-column:1/-1;justify-self:center;line-height:1}
  .pixrow .res-wrap{grid-column:1/-1;justify-self:center;width:62%}}
.op{font-family:var(--f-display);font-weight:700;font-size:1.3rem}
.swatch{width:100%;height:84px;border-radius:8px;border:1.5px solid var(--ink)}

/* ---------- flashcards ---------- */
.fc{perspective:900px;min-height:200px}
.fc-in{position:relative;width:100%;min-height:200px;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r);border:1.5px solid var(--ink);
  padding:20px;display:grid;place-content:center;text-align:center;gap:8px;background:var(--card)}
.fc-back{transform:rotateY(180deg);background:var(--ink);color:var(--paper);text-align:left;place-content:center start}
.fc-face .term{font-family:var(--f-display);font-weight:700;font-size:1.6rem;line-height:1.3}
@media (prefers-reduced-motion:reduce){.fc-in,.station{transition:none}}

/* ---------- sort game ---------- */
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.bin{appearance:none;border:2px dashed var(--line);border-radius:10px;padding:10px;min-height:80px;display:grid;gap:6px;align-content:start;background:var(--card);cursor:pointer;text-align:left}
.bin:hover{border-color:var(--ink)}
.bin b{font-size:.92rem}
.bin .chip{justify-self:start}
.token{font-family:var(--f-display);font-weight:700;font-size:1.4rem;padding:12px 18px;border:2px solid var(--ink);border-radius:10px;background:var(--marker);color:var(--on-marker);display:inline-block}

.mascot{display:flex;align-items:flex-end;gap:12px}
.mascot img{width:84px;height:auto;flex:none}
.mascot.big img{width:128px}
.mascot.sm img{width:58px}
.bubble{position:relative;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:10px 16px;font-weight:500;line-height:1.7;margin-bottom:14px;min-width:0;display:grid;gap:2px}
.bubble::before{content:"";position:absolute;left:-9px;bottom:14px;width:14px;height:14px;background:var(--card);border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}
.mascot.sm .bubble{margin-bottom:6px;padding:8px 14px}
.mascot.sm .bubble::before{bottom:10px}
.mascot.hop img{animation:hop .5s ease}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-10px)}100%{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.mascot.hop img{animation:none}}
@media (max-width:480px){.mascot img{width:64px}.mascot.big img{width:92px}}
.hero-pal{display:grid;justify-items:center;align-content:center;gap:6px}
.hero-pal img{width:min(220px,60%);height:auto}
.hero-pal .bubble{margin:0 0 12px}
.hero-pal .bubble::before{left:50%;bottom:-9px;margin-left:-7px;transform:rotate(-45deg)}
@media (max-width:760px){.hero-pal{grid-template-columns:auto minmax(0,1fr);align-items:end;justify-items:start;gap:12px}
  .hero-pal img{width:92px;order:-1}.hero-pal .bubble{margin:0 0 14px}
  .hero-pal .bubble::before{left:-9px;bottom:14px;margin:0;transform:rotate(45deg)}}
.bubble{word-break:auto-phrase}
.dblab .tbl th,.dblab .tbl td{padding:4px 8px;line-height:1.5}
.q-stem .tbl th,.q-stem .tbl td{white-space:nowrap}
.start-card{border:2px solid var(--accent);background:var(--accent-soft)}
.vis-pix{display:grid;grid-template-columns:repeat(8,22px);gap:2px}
.vis-pix i{display:block;width:22px;height:22px;border-radius:2px}
.vis-cap{font-size:.85rem;color:var(--muted);margin-top:6px}
.vis-flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.vis-flow span{border:1.5px solid var(--line);border-radius:8px;padding:4px 10px;background:var(--card);font-weight:500}
.vis-flow span.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.vis-flow b{color:var(--muted);font-weight:400}
.station .vis-flow span{font-size:.75rem;padding:1px 7px}
.story-strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}

.tm-item{display:grid;gap:8px;border-radius:10px;padding:10px 12px;background:var(--card-2)}
.tm-item.ok{background:var(--good-soft)}.tm-item.ng{background:var(--bad-soft)}
.tm-gun ol{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.tm-gun li{display:flex;gap:8px;align-items:flex-start;font-size:.92rem}
.oval.sm{width:28px;height:18px;font-size:.72rem;margin-top:3px}
.mk{display:grid;gap:6px}
.mk-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mk-k{min-width:2em;height:1.6em;display:inline-grid;place-items:center;border:1.8px solid var(--ink);border-radius:4px;font-weight:700;background:var(--card)}
.mk-ov{display:flex;flex-wrap:wrap;gap:4px}
.ov{width:32px;height:24px;border-radius:50%;border:1.8px solid var(--accent);background:var(--card);color:var(--accent);font-family:var(--f-code);font-size:.8rem;font-weight:700;cursor:pointer;padding:0}
.ov.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.ov.right{box-shadow:0 0 0 3px var(--good)}
.ov:disabled{cursor:default}
.tm-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--paper);border-radius:999px;padding:8px 10px 8px 18px;box-shadow:0 8px 24px rgba(22,27,43,.3);max-width:calc(100% - 24px)}
.tm-bar .btn{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.tm-bar.warn .tm-clock{color:var(--marker)}
.tm-bar.over{background:var(--bad)}
.tm-clock{font-family:var(--f-code);font-weight:700;white-space:nowrap}
.tm-cnt{white-space:nowrap;opacity:.85}
.tm-score{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
.tm-score .big{font-size:2.6rem;font-weight:900;color:var(--accent);line-height:1}
.tm-parts{display:grid;gap:6px}
.tm-parts>div{display:grid;grid-template-columns:5em minmax(0,1fr) 4.5em;gap:10px;align-items:center;font-size:.88rem}
.tm-parts span:last-child{text-align:right}
.tm-parts .rk-meter i{background:var(--cobalt)}
ol.how-s{margin:0;padding-left:1.4em;display:grid;gap:4px;font-size:.93rem}
.kk-sheet{display:grid;gap:14px}
.kk-dai{border:1.5px solid var(--line);border-radius:12px;padding:12px}
.kk-dh{display:flex;gap:10px;align-items:baseline;margin-bottom:8px}
.kk-gs{display:flex;flex-wrap:wrap;gap:8px}
.kk-g{display:flex;gap:2px;border:1.5px solid var(--line);border-radius:8px;padding:4px;background:var(--card)}
.kk-g.ok{border-color:var(--good);background:var(--good-soft)}.kk-g.ng{border-color:var(--bad);background:var(--bad-soft)}.kk-g.part{border-color:var(--marker);background:#FFF7D6}
.kk-c{display:grid;justify-items:center;gap:1px;font-size:.78rem;font-weight:700}
.kk-c input{width:30px;height:32px;text-align:center;font-family:var(--f-code);font-size:1rem;font-weight:700;border:1.5px solid var(--line);border-radius:6px;padding:0;background:var(--paper);color:var(--ink)}
.kk-c input:focus{outline:2px solid var(--cobalt);border-color:var(--cobalt)}
.kk-next{background:var(--cobalt-soft);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.kk-miss summary{cursor:pointer;font-weight:700}
@media (max-width:440px){.mk-row{flex-wrap:nowrap;gap:6px}.mk-ov{flex-wrap:nowrap;gap:2px}.ov{width:23px;height:21px;font-size:.72rem}.mk-k{min-width:1.8em}.tm-item{padding:10px 8px}.tm-bar{gap:8px;padding-left:14px}.tm-cnt{display:none}}

.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.9em;line-height:1.2;margin:0 2px}

.tasuki{display:grid;grid-template-columns:auto auto auto auto;gap:8px 12px;align-items:center;justify-content:start;font-family:var(--f-code);font-size:1.1rem;font-weight:600}

.nl-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.88rem}
.nl-legend span{display:inline-flex;align-items:center;gap:6px}
.nl-legend i{display:inline-block;width:22px;height:6px;border-radius:3px}
.datain{width:100%;font-family:var(--f-code);min-height:4.2em;resize:vertical}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}

.map{display:flex;height:58px;border-radius:8px;overflow:hidden;border:1.5px solid var(--ink)}

.tbl.ctr td,.tbl.ctr th{text-align:center}

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const h = (str) => { const t = document.createElement('template'); t.innerHTML = str.trim(); return t.content.firstElementChild; };
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* 数式の表記：F(分子,分母) R(根号の中) */
const F = (a, b) => `<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const R = (x) => `<span class="rt">√<span>${x}</span></span>`;
const BAR = (x) => `<span class="ov-bar">${x}</span>`;
const M = (s) => s.replace(/-/g, '−');

/* 分数（約分つき） */
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; }
function Q(n, d = 1) { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return { n: n / g, d: d / g }; }
const qadd = (x, y) => Q(x.n * y.d + y.n * x.d, x.d * y.d);
const qmul = (x, y) => Q(x.n * y.n, x.d * y.d);
const qneg = x => Q(-x.n, x.d);
function qs(x, opt = {}) { // 表示用
  const sgn = x.n < 0 ? '−' : (opt.plus ? '+' : '');
  const a = Math.abs(x.n);
  return x.d === 1 ? sgn + a : sgn + F(a, x.d);
}
const qv = x => x.n / x.d;

const STORE_KEY = 'math1-lab-v1';
const S = (() => {
  let d = { ans: {}, cards: {} };
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) d = Object.assign(d, JSON.parse(raw)); } catch (e) {}
  return d;
})();
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {} updateXP(); }

const RANKS = [[0, '自然数見習い'], [5, '整数使い'], [15, '有理数使い'], [30, '無理数使い'], [50, '実数マスター'], [75, '関数マスター'], [100, '数学Ⅰ 免許皆伝']];
const RANK_NOTE = ['1, 2, 3, … ものを数える数', '0 や負の数も仲間入り', '分数で表せる数', '√2 や π のように分数で表せない数', '数直線上のすべての数', 'x が決まると y がただ1つ決まる', '全問正解！'];
function xpStat() {
  const ids = new Set(QUESTIONS.map(q => q.id));
  const n = Object.entries(S.ans).filter(([id, v]) => v === true && ids.has(id)).length;
  const N = QUESTIONS.length, pct = N ? Math.floor(n / N * 100) : 0;
  let r = 0; RANKS.forEach(([k], i) => { if (pct >= k) r = i; });
  const need = k => { let m = 0; while (m < N && Math.floor(m / N * 100) < k) m++; return m; };
  return { n, N, pct, r, need };
}
function openRank() {
  const { n, N, pct, r, need } = xpStat();
  const nx = RANKS[r + 1];
  const cur = need(RANKS[r][0]), nxt = nx ? need(nx[0]) : N;
  const prog = nx ? Math.round((n - cur) / Math.max(1, nxt - cur) * 100) : 100;
  const crs = Object.keys(COURSE_NAME).map(c => {
    const qs = QUESTIONS.filter(q => q.unit === c), ok = qs.filter(q => S.ans[q.id] === true).length;
    return `<div><span>${COURSE_NAME[c]}</span><span class="rk-meter"><i style="width:${qs.length ? ok / qs.length * 100 : 0}%"></i></span><span>${ok}/${qs.length}</span></div>`;
  }).join('');
  const ov = h(`<div class="rk-ov" role="dialog" aria-modal="true" aria-label="ランクの成長"><div class="rk-box">
    <div class="rk-top"><img src="${MASCOT_SRC}" alt="" width="349" height="360"><div><div class="eyebrow">いまのランク</div><h3>${RANKS[r][1]}</h3><span class="small muted">達成率 ${pct}%・${n}/${N}問正解</span></div><button class="rk-x" aria-label="閉じる">×</button></div>
    <div class="rk-next">${nx ? `<div>あと <b class="n">${nxt - n}</b> 問正解で「<b>${nx[1]}</b>」に成長！</div><div class="rk-meter" aria-hidden="true"><i style="width:${prog}%"></i></div>` : '<div><b>最高ランクに到達！</b>全問正解おめでとう。</div>'}</div>
    <div class="rk-h">成長の道のり</div>
    <ol class="rk-list">${RANKS.map(([k, name], i) => `<li class="${i < r ? 'done' : i === r ? 'now' : 'lock'}"><span class="pt">${i < r ? '✓' : i + 1}</span><span class="nm">${i > r + 1 ? '？？？' : name}<small>${i > r + 1 ? '正解を増やすと見えてくる' : RANK_NOTE[i]}</small></span><span class="th">${k}%・${need(k)}問</span></li>`).join('')}</ol>
    <div class="rk-h">単元別の正解数</div>
    <div class="rk-crs">${crs}</div>
    <button class="btn" data-g="drill">問題ドリルで正解を増やす →</button>
  </div></div>`);
  const close = () => { ov.remove(); document.removeEventListener('keydown', escK); $('#rank').focus(); };
  const escK = e => { if (e.key === 'Escape') close(); };
  ov.addEventListener('click', e => { if (e.target === ov) close(); });
  $('.rk-x', ov).onclick = close;
  $('[data-g]', ov).onclick = () => { close(); go('drill'); };
  document.addEventListener('keydown', escK);
  document.body.appendChild(ov);
  $('.rk-x', ov).focus();
}
function updateXP() {
  const { n, N, pct } = xpStat();
  $('#xpn').textContent = pct + '%';
  $('#xpbar').style.width = pct + '%';
  $('.xp-rate').title = `問題 ${N} 問中 ${n} 問正解`;
  let r = RANKS[0][1]; RANKS.forEach(([k, name]) => { if (pct >= k) r = name; });
  $('#rank').textContent = r;
}

let CUR_VIEW = null;
// 埋め込み枠（Googleサイトなど）ではURLの書きかえが禁止されることがあるため、表示中のページは変数で持つ
function go(id) {
  CUR_VIEW = id;
  try { if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id); } catch (e) {}
  route();
}
function route() {
  const id = CUR_VIEW || (location.hash || '#home').slice(1);
  const v = VIEWS[id] ? id : 'home';
  renderTabs(v);
  const view = $('#view'); view.innerHTML = '';
  VIEWS[v](view);
  if (TIPS[v]) { const hd = $('.sec-head', view); if (hd) hd.after(mascot(TIPS[v])); }
  window.scrollTo({ top: 0 });

/* ===== 単元3 2次関数 ===== */
function simpSqrt(n) { let k = 1, m = n; for (let d = 2; d * d <= m; d++) while (m % (d * d) === 0) { m /= d * d; k *= d; } return [k, m]; }
// x² + bx + c = 0 の2つの解（b, c は整数）。[α, β, 小数α, 小数β]
function rootPair(b, c) {
  const D = b * b - 4 * c; const [k, m] = simpSqrt(D);
  const al = (-b - Math.sqrt(D)) / 2, be = (-b + Math.sqrt(D)) / 2;
  if (m === 1) return [qs(Q(-b - k, 2)), qs(Q(-b + k, 2)), al, be];
  const rp = (sgn) => {
    if ((b % 2 === 0) && (k % 2 === 0)) { const p = -b / 2, q = k / 2; return `${p ? M(String(p)) + ' ' + (sgn < 0 ? '−' : '+') + ' ' : (sgn < 0 ? '−' : '')}${q === 1 ? '' : q}√${m}`; }
    return F(`${b ? M(String(-b)) + ' ' + (sgn < 0 ? '−' : '+') + ' ' : (sgn < 0 ? '−' : '')}${k === 1 ? '' : k}√${m}`, 2);
  };
  return [rp(-1), rp(1), al, be];
}

  choices: ['a⁴ − b⁴', 'a⁴ + b⁴', 'a⁴ − 2a²b² + b⁴', 'a⁴ + 2a²b² + b⁴'], ans: 0,
  exp: '<p>前の2つをまとめて (a + b)(a − b) = a² − b²。次に (a² − b²)(a² + b²) = <mark>a⁴ − b⁴</mark>。<br>和と差の積の公式を2回使う。順番を工夫すると計算が短くなる。</p>' },
{ id: 's10', unit: 'shiki', type: '式の値', lv: 3,
  stem: `<p>x = ${F(1, R(3) + ' − ' + R(2))} のとき、x² + ${F(1, 'x²')} の値はどれか。</p>`,

{ id: 's11', unit: 'shiki', type: '因数分解', lv: 2,
  stem: '<p>x² − y² + 4y − 4 を因数分解したものはどれか。</p>',
  choices: ['(x + y − 2)(x − y + 2)', '(x + y + 2)(x − y − 2)', '(x − y − 2)(x − y + 2)', '(x + y − 2)(x + y + 2)'], ans: 0,
  exp: '<p>y の項をまとめると −(y² − 4y + 4) = −(y − 2)²。<br>x² − (y − 2)² = {x + (y − 2)}{x − (y − 2)} = <mark>(x + y − 2)(x − y + 2)</mark>。</p>' },
{ id: 's12', unit: 'shiki', type: '連立不等式', lv: 2,
  stem: '<p>連立不等式 2x − 1 &gt; 3、x + 4 ≧ 3x − 2 を解け。</p>',
  choices: ['2 &lt; x ≦ 3', 'x &gt; 2', 'x ≦ 3', '2 ≦ x &lt; 3'], ans: 0,

{ id: 's13', unit: 'shiki', type: '不等式の応用', lv: 3,
  stem: '<p>不等式 3x − 7 &lt; x + 5 を満たす<b>自然数</b> x は何個あるか。</p>',

  exp: '<p>2x &lt; 12 より x &lt; 6。自然数は 1, 2, 3, 4, 5 の <mark>5個</mark>。<br>x = 6 は「&lt;」なのでふくまない。0 は自然数ではない。</p>' },
{ id: 's14', unit: 'shiki', type: '循環小数', lv: 1,
  stem: '<p>循環小数 0.454545…（45 がくり返す）を分数で表したものはどれか。</p>',

{ id: 's15', unit: 'shiki', type: '根号の計算', lv: 1,
  stem: `<p>(${R(3)} + 1)² を計算したものはどれか。</p>`,
  choices: ['4 + 2' + R(3), '4', '2 + 2' + R(3), '4 + ' + R(3)], ans: 0,
  exp: `<p>(${R(3)})² + 2·${R(3)}·1 + 1² = 3 + 2${R(3)} + 1 = <mark>4 + 2${R(3)}</mark>。まん中の 2ab を忘れると ① になる。</p>` },
{ id: 's16', unit: 'shiki', type: '絶対値', lv: 3,
  stem: '<p>方程式 |2x − 3| = 5 の解はどれか。</p>',
  choices: ['x = 4', 'x = 4, −1', 'x = −4, 1', 'x = 1, 4'], ans: 1,
  exp: '<p>2x − 3 = 5 または 2x − 3 = −5。それぞれ x = 4、x = −1。答えは <mark>x = 4, −1</mark>。<br>絶対値の方程式は「+ と − の2通り」を考える。</p>' },

{ id: 'g1', unit: 'shugo', type: '共通部分', lv: 1, inUnit: true,
  stem: '<p>全体集合 U = {1, 2, 3, …, 10}、A = {1, 2, 3, 4, 5}、B = {2, 4, 6, 8, 10} とする。A∩B はどれか。</p>',

{ id: 'g2', unit: 'shugo', type: '補集合', lv: 1, inUnit: true,
  stem: `<p>全体集合 U = {1, 2, 3, …, 10}、A = {1, 2, 3, 4, 5}、B = {2, 4, 6, 8, 10} とする。${BAR('A')}∩B はどれか。</p>`,

{ id: 'g3', unit: 'shugo', type: 'ド・モルガン', lv: 2, inUnit: true,
  stem: `<p>全体集合 U = {1, 2, 3, …, 10}、A = {1, 2, 3, 4, 5}、B = {2, 4, 6, 8, 10} とする。${BAR('A∪B')} はどれか。</p>`,

{ id: 'g4', unit: 'shugo', type: '必要・十分', lv: 1, inUnit: true,
  stem: '<p>x は実数とする。「x = 3」は「x² = 9」であるための何か。</p>',
  choices: NS4, ans: 2,
  exp: '<p>x = 3 ⇒ x² = 9 は真。x² = 9 ⇒ x = 3 は偽（反例 x = −3）。<br>矢印の出発点の「x = 3」は <mark>十分条件であるが、必要条件ではない</mark>。</p>' },
{ id: 'g5', unit: 'shugo', type: '必要・十分', lv: 2, inUnit: true,
  stem: '<p>x は実数とする。「x &gt; 2」は「x &gt; 5」であるための何か。</p>',
  choices: NS4, ans: 1,
  exp: '<p>x &gt; 5 ⇒ x &gt; 2 は真（せまい範囲 ⇒ 広い範囲）。x &gt; 2 ⇒ x &gt; 5 は偽（反例 x = 3）。<br>矢印の到着点の「x &gt; 2」は <mark>必要条件であるが、十分条件ではない</mark>。</p>' },
{ id: 'g6', unit: 'shugo', type: '必要・十分', lv: 2,
  stem: '<p>x は実数とする。「x² = x」は「x = 1」であるための何か。</p>',
  choices: NS4, ans: 1,

{ id: 'g7', unit: 'shugo', type: '必要・十分', lv: 2,
  stem: '<p>△ABC において、「AB = AC」は「∠B = ∠C」であるための何か。</p>',
  choices: NS4, ans: 0,
  exp: '<p>二等辺三角形の性質（2辺が等しい ⇒ 底角が等しい）と、その逆（2角が等しい ⇒ 2辺が等しい）はどちらも成り立つ。<br>よって <mark>必要十分条件</mark>（同値）。</p>' },
{ id: 'g8', unit: 'shugo', type: '必要・十分', lv: 2,
  stem: '<p>x, y は実数とする。「x = 0」は「xy = 0」であるための何か。</p>',
  choices: NS4, ans: 2,
  exp: '<p>x = 0 ⇒ xy = 0 は真。xy = 0 ⇒ x = 0 は偽（反例 x = 1, y = 0）。<br>よって「x = 0」は <mark>十分条件であるが、必要条件ではない</mark>。</p>' },
{ id: 'g9', unit: 'shugo', type: '反例', lv: 1,
  stem: '<p>命題「x² = 1 ならば x = 1」の反例はどれか。</p>',
  choices: ['x = 1', 'x = −1', 'x = 0', 'x = 2'], ans: 1,
  exp: '<p>反例は「仮定（x² = 1）を満たすのに、結論（x = 1）を満たさない例」。<mark>x = −1</mark> がそれにあたる。<br>② と ③ はそもそも仮定 x² = 1 を満たさないので反例にならない。</p>' },
{ id: 'g10', unit: 'shugo', type: '対偶', lv: 2,
  stem: '<p>命題「x + y &gt; 2 ならば x &gt; 1 または y &gt; 1」の対偶はどれか。</p>',
  choices: ['x &gt; 1 または y &gt; 1 ならば x + y &gt; 2', 'x + y ≦ 2 ならば x ≦ 1 かつ y ≦ 1', 'x ≦ 1 または y ≦ 1 ならば x + y ≦ 2', 'x ≦ 1 かつ y ≦ 1 ならば x + y ≦ 2'], ans: 3,
  exp: '<p>対偶は「結論の否定 ⇒ 仮定の否定」。「x &gt; 1 または y &gt; 1」の否定は「x ≦ 1 <b>かつ</b> y ≦ 1」。<br>よって <mark>x ≦ 1 かつ y ≦ 1 ならば x + y ≦ 2</mark>。⓪ は逆、① は裏。</p>' },
{ id: 'g11', unit: 'shugo', type: '否定', lv: 1,
  stem: '<p>条件「x &gt; 0 かつ y &gt; 0」の否定はどれか。</p>',
  choices: ['x ≦ 0 かつ y ≦ 0', 'x ≦ 0 または y ≦ 0', 'x &lt; 0 または y &lt; 0', 'x &gt; 0 または y &gt; 0'], ans: 1,
  exp: '<p>否定すると「かつ」は「または」に、「&gt;」は「≦」になる。<mark>x ≦ 0 または y ≦ 0</mark>。<br>② は「= 0」の場合がぬけている。</p>' },
{ id: 'g12', unit: 'shugo', type: '証明', lv: 2,
  stem: '<p>n は整数とする。命題「n² が偶数ならば n は偶数」を証明するのに、もっとも適した方法はどれか。</p>',
  choices: ['逆「n が偶数ならば n² は偶数」を示す', '対偶「n が奇数ならば n² は奇数」を示す', '裏「n² が奇数ならば n は奇数」を示す', 'n = 2 のときに成り立つことを示す'], ans: 1,
  exp: '<p>もとの命題と対偶は真偽が一致するので、<mark>対偶を示せばよい</mark>。n = 2k + 1 とおくと n² = 2(2k² + 2k) + 1 で奇数。<br>逆や裏が真でも、もとの命題が真とは言えない。1つの例だけでは証明にならない。</p>' },
{ id: 'g13', unit: 'shugo', type: '背理法', lv: 3,
  stem: `<p>「${R(2)} は無理数である」を背理法で証明するとき、最初に仮定することはどれか。</p>`,

  exp: `<p>背理法は「示したいことの<b>否定</b>」を仮定して矛盾を導く方法。「無理数である」の否定は <mark>有理数である</mark>。<br>${R(2)} = ${F('m', 'n')} から m² = 2n² を導き、m も n も偶数になって「互いに素」と矛盾する。</p>` },
{ id: 'g14', unit: 'shugo', type: '部分集合', lv: 2,
  stem: '<p>A = {x | −1 &lt; x &lt; 3}、B = {x | 0 &lt; x &lt; 2}（x は実数）のとき、正しいものはどれか。</p>',
  choices: ['A ⊂ B', 'B ⊂ A', 'A = B', 'A∩B = ∅'], ans: 1,
  exp: '<p>数直線にかくと、B の範囲 0 &lt; x &lt; 2 は A の範囲 −1 &lt; x &lt; 3 にすっぽり入る。よって <mark>B ⊂ A</mark>（B は A の部分集合）。</p>' },
{ id: 'g15', unit: 'shugo', type: '必要・十分', lv: 3,
  stem: '<p>x は実数とする。「|x| &lt; 1」は「x &lt; 1」であるための何か。</p>',

{ id: 'k1', unit: 'kansu', type: '頂点', lv: 1, inUnit: true,
  stem: '<p>放物線 y = 2(x − 3)² + 1 の頂点の座標はどれか。</p>',

  exp: '<p>y = a(x − p)² + q の頂点は (p, q)。かっこの中が「x − 3」なので p = 3。頂点は <mark>(3, 1)</mark>。</p>' },
{ id: 'k2', unit: 'kansu', type: '平方完成', lv: 2, inUnit: true,
  stem: '<p>放物線 y = x² − 6x + 5 の頂点の座標はどれか。</p>',
  choices: ['(3, −4)', '(−3, −4)', '(3, 5)', '(6, 5)'], ans: 0,
  exp: '<p>x² − 6x = (x − 3)² − 9 なので、y = (x − 3)² − 9 + 5 = (x − 3)² − 4。頂点は <mark>(3, −4)</mark>。<br>頂点の x 座標は −b/2a = 6/2 = 3 でも求められる。</p>' },
{ id: 'k3', unit: 'kansu', type: '平方完成', lv: 2, inUnit: true,
  stem: '<p>y = 2x² + 8x + 3 を平方完成したものはどれか。</p>',
  choices: ['y = 2(x + 2)² − 5', 'y = 2(x + 4)² − 13', 'y = 2(x + 2)² + 3', 'y = 2(x − 2)² − 5'], ans: 0,

{ id: 'k4', unit: 'kansu', type: '平行移動', lv: 1, inUnit: true,

  choices: ['y = (x + 2)² − 3', 'y = (x − 2)² − 3', 'y = (x − 2)² + 3', 'y = (x + 2)² + 3'], ans: 1,
  exp: '<p>頂点が (0, 0) から (2, −3) に移るので <mark>y = (x − 2)² − 3</mark>。<br>x 軸方向に +2 動かすと、式では x が「x − 2」になる。</p>' },
{ id: 'k5', unit: 'kansu', type: '最大・最小', lv: 2, inUnit: true,
  stem: '<p>関数 y = x² − 4x + 1（0 ≦ x ≦ 3）の<b>最大値</b>はどれか。</p>',
  choices: ['1', '−2', '−3', '3'], ans: 0,
  exp: '<p>y = (x − 2)² − 3。軸 x = 2 は範囲の中にある。軸から遠いのは x = 0 の方（距離 2）で、x = 0 のとき y = 1。最大値は <mark>1</mark>。<br>② の −3 は最小値（x = 2）、① は x = 3 のときの値。</p>' },
{ id: 'k6', unit: 'kansu', type: '2次方程式', lv: 1,
  stem: '<p>2次方程式 x² − 3x − 10 = 0 の解はどれか。</p>',
  choices: ['x = −5, 2', 'x = 10, −1', 'x = 5, −2', 'x = 5, 2'], ans: 2,
  exp: '<p>かけて −10、たして −3 になる2数は −5 と 2。(x − 5)(x + 2) = 0 より <mark>x = 5, −2</mark>。</p>' },
{ id: 'k7', unit: 'kansu', type: '解の公式', lv: 2,
  stem: '<p>2次方程式 x² − 4x + 1 = 0 の解はどれか。</p>',
  choices: ['x = 2 ± ' + R(3), 'x = −2 ± ' + R(3), 'x = 4 ± ' + R(3), 'x = 2 ± ' + R(5)], ans: 0,

{ id: 'k8', unit: 'kansu', type: '判別式', lv: 2,
  stem: '<p>2次方程式 2x² + 3x + k = 0 が実数解をもたないような定数 k の値の範囲はどれか。</p>',

{ id: 'k9', unit: 'kansu', type: '2次不等式', lv: 2,
  stem: '<p>2次不等式 x² − x − 6 &lt; 0 を解け。</p>',
  choices: ['x &lt; −2, 3 &lt; x', '−2 &lt; x &lt; 3', '−3 &lt; x &lt; 2', 'x &lt; −3, 2 &lt; x'], ans: 1,
  exp: '<p>(x + 2)(x − 3) &lt; 0。グラフは x = −2, 3 で x 軸と交わる下に凸の放物線。x 軸より下にあるのは間の部分なので <mark>−2 &lt; x &lt; 3</mark>。</p>' },
{ id: 'k10', unit: 'kansu', type: '2次不等式', lv: 2,
  stem: '<p>2次不等式 x² − 4x + 4 &gt; 0 の解はどれか。</p>',
  choices: ['x = 2', '2 以外のすべての実数', 'すべての実数', '解なし'], ans: 1,
  exp: '<p>(x − 2)² &gt; 0。2乗は 0 以上で、0 になるのは x = 2 のときだけ。よって <mark>2 以外のすべての実数</mark>。<br>グラフは x = 2 で x 軸に接し、それ以外では x 軸より上にある。</p>' },
{ id: 'k11', unit: 'kansu', type: '2次不等式', lv: 2,
  stem: '<p>2次不等式 x² + 2x + 3 ≦ 0 の解はどれか。</p>',
  choices: ['すべての実数', '解なし', 'x = −1', '−3 ≦ x ≦ 1'], ans: 1,
  exp: '<p>D = 4 − 12 = −8 &lt; 0 なので、グラフは x 軸と共有点をもたず、つねに x 軸より上。0 以下になることはないので <mark>解なし</mark>。<br>（x² + 2x + 3 = (x + 1)² + 2 ≧ 2 でも確かめられる）</p>' },
{ id: 'k12', unit: 'kansu', type: '判別式', lv: 3,
  stem: '<p>放物線 y = x² + kx + 9 が x 軸に接するような定数 k の値はどれか。</p>',
  choices: ['k = ±6', 'k = 6', 'k = ±3', 'k = ±9'], ans: 0,
  exp: '<p>x 軸に接する ⇔ D = 0。D = k² − 36 = 0 より <mark>k = ±6</mark>。<br>k = 6 だけでなく、k = −6 のとき（y = (x − 3)²）も接する。</p>' },
{ id: 'k13', unit: 'kansu', type: '最大・最小', lv: 3,
  stem: `<p>関数 y = x² − 2x（0 ≦ x ≦ ${F(1, 2)}）の最小値はどれか。</p>`,
  choices: ['−' + F(3, 4), '−1', '0', '−' + F(1, 2)], ans: 0,
  exp: `<p>y = (x − 1)² − 1。軸 x = 1 は範囲 0 ≦ x ≦ ${F(1, 2)} より右にあるので、範囲の中ではグラフは右下がり。<br>最小は右はし x = ${F(1, 2)} で、y = ${F(1, 4)} − 1 = <mark>−${F(3, 4)}</mark>。① の −1 は頂点の値で、範囲に入っていない。</p>` },
{ id: 'k14', unit: 'kansu', type: '最大・最小', lv: 2,
  stem: '<p>関数 y = −x² + 6x − 5 の最大値はどれか。</p>',
  choices: ['−5', '3', '4', '9'], ans: 2,
  exp: '<p>y = −(x² − 6x) − 5 = −(x − 3)² + 9 − 5 = −(x − 3)² + 4。上に凸なので頂点で最大、最大値は <mark>4</mark>（x = 3）。</p>' },

   ['glossary', '用語集', `5単元の用語 ${GLOSSARY.length} 語を50音順に。検索してすぐ意味を確認できる`, '']].forEach(([id, name, desc, pr]) => {
    const b = h(`<button class="card station"><span class="ic">TOOL</span><h3>${name}</h3><p class="small muted">${desc}</p>${pr}</button>`);
    b.onclick = () => go(id); st.appendChild(b);
  });
  root.appendChild(st);

  root.appendChild(sectionHead('TODAY', '今日の1問', 'ページを開くたびに入れかわる。'));
  const pool = QUESTIONS.filter(q => S.ans[q.id] !== true);
  const p = (pool.length ? pool : QUESTIONS)[Math.floor(Math.random() * (pool.length || QUESTIONS.length))];
  root.appendChild(quizCard(p));
};

/* ===== 問題ドリル ===== */
VIEWS.drill = (root) => {
  root.appendChild(sectionHead('DRILL', '問題ドリル', `この教材のためのオリジナル問題 ${QUESTIONS.length} 問。★の数はむずかしさの目安。`));
  const ctl = h(`<section class="card lab">
    <div class="row"><div class="seg" id="dmode"><button aria-pressed="true" data-m="chal">10問チャレンジ</button><button aria-pressed="false" data-m="list">一覧で解く</button></div></div>
    <div class="row">
      <label class="ctl" for="dunit">単元<select id="dunit"><option value="all">すべて</option>${Object.entries(COURSE_NAME).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></label>
      <label class="ctl" for="dlv">むずかしさ<select id="dlv"><option value="0">すべて</option><option value="1">★</option><option value="2">★★</option><option value="3">★★★</option></select></label>
      <label class="ctl" for="dfil">対象<select id="dfil"><option value="all">全問</option><option value="todo">まだ正解していない問題</option><option value="wrong">まちがえた問題</option></select></label>
      <div class="row" style="align-self:end"><button class="btn" id="dgo">スタート</button><button class="btn ghost sm" id="drs">記録をリセット</button></div>
    </div>
    <div id="dconf" class="trap" hidden>正解の記録と公式カードの記録をすべて消します。<button class="btn sm" id="dyes" style="margin-left:8px">消す</button><button class="btn ghost sm" id="dno">やめる</button></div>
  </section>`);
  root.appendChild(ctl);
  if (window.__dunit) { $('#dunit', ctl).value = window.__dunit; window.__dunit = null; }
  const area = h('<div style="display:grid;gap:14px"></div>');
  root.appendChild(area);
  let mode = 'chal';
  $$('[data-m]', ctl).forEach(b => b.onclick = () => { mode = b.dataset.m; $$('[data-m]', ctl).forEach(x => x.setAttribute('aria-pressed', x === b)); start(); });
  function pool() {
    const u = $('#dunit', ctl).value, f = $('#dfil', ctl).value, lv = +$('#dlv', ctl).value;
    return QUESTIONS.filter(q => (u === 'all' || q.unit === u) && (!lv || q.lv === lv) && (f === 'all' || (f === 'todo' ? S.ans[q.id] !== true : S.ans[q.id] === false)));
  }
  function start() {
    area.innerHTML = '';
    let p = pool();
    if (!p.length) { area.appendChild(h('<div class="card lab"><p>条件に合う問題がない。対象を「全問」にしてみよう。</p></div>')); return; }
    if (mode === 'list') { p.forEach((q, i) => area.appendChild(quizCard(q, { num: i + 1 }))); return; }
    p = p.slice().sort(() => Math.random() - 0.5).slice(0, 10);
    let done = 0, score = 0;
    const bar = h(`<div class="card lab dchal" style="position:sticky;top:calc(env(safe-area-inset-top,0px) + 100px);z-index:5;padding:12px 20px"><div class="row"><b>${$('#dunit', ctl).selectedOptions[0].textContent}・${p.length}問チャレンジ</b><div class="bar" style="flex:1;min-width:120px"><i></i></div><span class="small tnum" id="dpos"></span></div></div>`);
    area.appendChild(bar);
    const tally = () => { $('i', bar).style.width = (done / p.length * 100) + '%'; $('#dpos', bar).textContent = `解答 ${done} / ${p.length}　正解 ${score}`; };
    tally();
    p.forEach((q, k) => area.appendChild(quizCard(q, { num: k + 1, onAnswer: ok => { done++; if (ok) score++; tally(); if (done === p.length) finish(); } })));
    const slot = h('<div style="display:grid;gap:14px"></div>'); area.appendChild(slot);
    function finish() {
      const pct = Math.round(score / p.length * 100);
      slot.appendChild(mascot(pct >= 80 ? 'すごい！よく理解できてるね。次は★の多い問題にも挑戦しよう！' : pct >= 50 ? 'あと一歩！まちがえた問題だけをもう一度解いてみよう。' : 'だいじょうぶ、ここからが本番。単元の実験で手を動かしてから再挑戦しよう！', 'big'));
      slot.appendChild(h(`<div class="card count" style="text-align:left"><div class="lbl">結果</div><div class="days tnum">${score}<small>/ ${p.length} 問</small></div>
        <div class="sub">${pct >= 80 ? 'この調子。定期テストの応用問題にも挑戦しよう。' : pct >= 50 ? 'あと一歩。まちがえた問題だけをもう一度解こう。' : 'まずは各単元の実験で手を動かしてから再挑戦しよう。'}</div></div>`));
      const again = h('<div class="row"><button class="btn">別の10問に挑戦</button><button class="btn ghost">まちがえた問題だけ</button></div>');
      $$('button', again)[0].onclick = () => { start(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
      $$('button', again)[1].onclick = () => { $('#dfil', ctl).value = 'wrong'; start(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
      slot.appendChild(again);
      setTimeout(() => slot.scrollIntoView({ behavior: 'smooth', block: 'start' }), 600);
    }
  }
  ['#dunit', '#dfil', '#dlv'].forEach(i => $(i, ctl).onchange = start);
  $('#dgo', ctl).onclick = start;
  $('#drs', ctl).onclick = () => { $('#dconf', ctl).hidden = false; };
  $('#dno', ctl).onclick = () => { $('#dconf', ctl).hidden = true; };
  $('#dyes', ctl).onclick = () => { S.ans = {}; S.cards = {}; save(); $('#dconf', ctl).hidden = true; start(); };
  start();
};

/* ===== 公式カード ===== */
VIEWS.cards = (root) => {
  root.appendChild(sectionHead('CARDS', '公式カード', `覚えておきたい公式・値 ${CARDS.length} 枚。表を見て中身を思い出してから、めくって確かめよう。`));
  const fc = h(`<section class="card lab">
    <div class="lab-head"><span class="kind">公式カード</span><h3>公式フラッシュ</h3><span class="small muted tnum" id="fcp"></span></div>
    <div class="row"><div class="seg" id="fccat"></div><label class="row small" for="fcunk" style="gap:6px"><input type="checkbox" id="fcunk"> 「まだ」だけ</label></div>
    <div class="fc" id="fc" tabindex="0" role="button" aria-label="カードをめくる"><div class="fc-in"><div class="fc-face fc-front"></div><div class="fc-face fc-back"></div></div></div>
    <div class="row" style="justify-content:center"><button class="btn ghost" id="fcno">まだ</button><button class="btn" id="fcflip">めくる</button><button class="btn ghost" id="fcok">覚えた</button></div>
  </section>`);
  root.appendChild(fc);
  let cat = 'all', deck = [], ci = 0;
  const seg = $('#fccat', fc);
  [['all', 'すべて'], ...Object.entries(COURSE_NAME)].forEach(([k, n]) => { const b = h(`<button aria-pressed="${k === 'all'}">${n}</button>`); b.onclick = () => { cat = k; $$('button', seg).forEach(x => x.setAttribute('aria-pressed', x === b)); build(); }; seg.appendChild(b); });
  function build() {
    deck = CARDS.map((c, i) => [i, ...c]).filter(c => (cat === 'all' || c[1] === cat) && (!$('#fcunk', fc).checked || S.cards[c[0]] !== 'ok'));
    deck.sort(() => Math.random() - 0.5); ci = 0; show();
  }
  function show() {
    $('#fc', fc).classList.remove('flip');
    const known = CARDS.filter((c, i) => S.cards[i] === 'ok').length;
    $('#fcp', fc).textContent = `覚えた ${known} / ${CARDS.length}`;
    if (!deck.length) { $('.fc-front', fc).innerHTML = '<div class="term">全部覚えた！</div><div class="small muted">「まだ」だけ のチェックを外すと全カードに戻る</div>'; $('.fc-back', fc).innerHTML = ''; return; }
    const [i, c, term, def] = deck[ci % deck.length];
    $('.fc-front', fc).innerHTML = `<span class="chip" style="justify-self:center">${COURSE_NAME[c]}</span><div class="term">${term}</div><div class="small muted">${ci % deck.length + 1} / ${deck.length}　押すとめくれる</div>`;
    setTimeout(() => { $('.fc-back', fc).innerHTML = `<div style="display:grid;gap:8px"><b>${term}</b><div class="fx" style="font-size:1.1rem">${def}</div></div>`; }, 150);
  }
  const flip = () => $('#fc', fc).classList.toggle('flip');
  $('#fc', fc).onclick = flip; $('#fc', fc).onkeydown = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } };
  $('#fcflip', fc).onclick = flip;
  const mark = v => { if (!deck.length) return; S.cards[deck[ci % deck.length][0]] = v; save(); ci++; show(); };
  $('#fcok', fc).onclick = () => mark('ok'); $('#fcno', fc).onclick = () => mark('ng');
  $('#fcunk', fc).onchange = build;
  build();

  root.appendChild(h(`<section class="card lab"><div class="lab-head"><span class="kind">一覧</span><h3>三角比の表（0° 〜 180°）</h3></div>
    <div class="scroll-x"><table class="tbl ctr"><thead><tr><th>θ</th>${Object.keys(TRIG).map(a => `<th>${a}°</th>`).join('')}</tr></thead><tbody>
    ${['sin θ', 'cos θ', 'tan θ'].map((n, j) => `<tr><th>${n}</th>${Object.values(TRIG).map(v => `<td>${v[j] === 'なし' ? '／' : v[j]}</td>`).join('')}</tr>`).join('')}
    </tbody></table></div><p class="small muted">tan 90° は定義されない（表では ／）。</p></section>`));
};

/* ===== 用語集 ===== */
const GYO = [['あ', 'あいうえお'], ['か', 'かきくけこがぎぐげご'], ['さ', 'さしすせそざじずぜぞ'], ['た', 'たちつてとだぢづでど'], ['な', 'なにぬねの'], ['は', 'はひふへほばびぶべぼぱぴぷぺぽ'], ['ま', 'まみむめも'], ['や', 'やゆよ'], ['ら', 'らりるれろ'], ['わ', 'わをん']];
const gyoOf = (y) => { const c = y[0]; const g = GYO.find(([, s]) => s.includes(c)); return g ? g[0] : 'A–Z'; };
VIEWS.glossary = (root) => {
  root.appendChild(sectionHead('GLOSSARY', '用語集', `5単元の用語 ${GLOSSARY.length} 語を50音順に並べた。検索ボックスには用語・読み・説明のどれを入れてもよい。`));
  const ctl = h(`<section class="card lab">
    <label class="ctl" for="gq">検索<input type="text" id="gq" placeholder="例：判別式、はんべつしき、外れ値" style="font-family:var(--f-body);font-size:1rem;width:100%"></label>
    <div class="row"><div class="seg" id="gcourse"></div></div>
    <div class="row" id="gidx" aria-label="50音の索引" style="gap:6px"></div>
  </section>`);
  root.appendChild(ctl);
  const list = h('<div id="glist" style="display:grid;gap:22px"></div>');
  root.appendChild(list);
  let course = 'all';
  const seg = $('#gcourse', ctl);
  [['all', 'すべて'], ...Object.entries(COURSE_NAME)].forEach(([k, n]) => {
    const b = h(`<button aria-pressed="${k === 'all'}">${n}</button>`);
    b.onclick = () => { course = k; $$('button', seg).forEach(x => x.setAttribute('aria-pressed', x === b)); draw(); };
    seg.appendChild(b);
  });
  $('#gq', ctl).oninput = draw;
  const hl = (html, q) => {
    if (!q) return html;
    const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    return html.split(/(<[^>]+>)/).map(p => p.startsWith('<') ? p : p.replace(re, m => `<mark class="hit">${m}</mark>`)).join('');
  };
  function draw() {
    const q = $('#gq', ctl).value.trim(), ql = q.toLowerCase();
    const items = GLOSSARY.filter(([t, y, c, d]) => (course === 'all' || c === course) &&
      (!q || t.toLowerCase().includes(ql) || y.includes(q) || d.replace(/<[^>]+>/g, '').toLowerCase().includes(ql)))
      .sort((a, b) => a[1].localeCompare(b[1], 'ja'));
    const groups = {};
    items.forEach(it => { const g = gyoOf(it[1]); (groups[g] = groups[g] || []).push(it); });
    const order = [...GYO.map(g => g[0]), 'A–Z'].filter(g => groups[g]);
    const idx = $('#gidx', ctl); idx.innerHTML = '';
    GYO.map(g => g[0]).forEach(g => {
      const b = h(`<button class="btn ghost sm" ${groups[g] ? '' : 'disabled'} style="min-width:2.6em">${g}</button>`);
      b.onclick = () => { const t = document.getElementById('g-' + g); if (t) window.scrollTo({ top: t.getBoundingClientRect().top + window.scrollY - 110, behavior: 'smooth' }); };
      idx.appendChild(b);
    });
    list.innerHTML = '';
    if (!items.length) { list.appendChild(mascot(`「${esc(q)}」は見つからなかったよ。<br>言いかえるか、単元を「すべて」にしてみてね。`)); return; }
    order.forEach(g => {
      const sec = h(`<section id="g-${g}" style="display:grid;gap:10px"><h3 style="font-size:1.4rem;border-bottom:2px solid var(--ink);padding-bottom:4px">${g}</h3><dl class="gl"></dl></section>`);
      const dl = $('dl', sec);
      groups[g].forEach(([t, y, c, d]) => {
        const row = h(`<div class="gl-row"><dt><span class="gl-term">${hl(t, q)}</span><span class="gl-yomi">${hl(y, q)}</span></dt>
          <dd><div>${hl(d, q)}</div><button class="chip gl-go">${COURSE_NAME[c]} →</button></dd></div>`);
        $('.gl-go', row).onclick = () => go(c);
        dl.appendChild(row);
      });
      list.appendChild(sec);
    });
  }
  draw();
};

    <p>右上の「達成率」は、全 ${QUESTIONS.length} 問のうち一度でも正解した問題の割合。正解を増やすとランクが「${RANKS.map(r => r[1]).join('」→「')}」と成長する。ランクの文字を押すと、次のランクまでの問題数が見られる。</p>
    <p class="small muted">記録はこの端末のブラウザにだけ保存される。別の端末やブラウザでは引きつがれない。ブラウザの履歴やサイトデータを消すと記録も消える。</p></section>`));
  const b = h('<div><button class="btn">ホームへ戻る →</button></div>'); $('button', b).onclick = () => go('home'); root.appendChild(b);
};
